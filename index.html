{ unit:"industrial", type:"choice",

/* =========================================================
   アプリ本体
   ========================================================= */
const $ = (id) => document.getElementById(id);
const LS_KEY = "rekishi_sougou_kimatsu_v1";

let quiz = [];        // 出題中の問題配列
let idx = 0;          // 現在の問題番号
let results = [];     // {q, score(0/0.5/1), userAns}
let orderPick = [];   // 整序問題の選択状態

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- スタート画面 ---------- */
function renderStart() {
  const hist = loadHistory();
  const histHtml = hist.length
    ? `<div class="card"><h2>これまでの成績</h2>` +
      hist.slice(-5).reverse().map(h =>
        `<div class="history-item">${h.date} … ${h.score}/${h.total}点 (${h.pct}%)</div>`).join("") +
      `</div>`
    : "";

  $("screen-start").innerHTML = `
    <div class="card">
      <h2>出題範囲(単元)</h2>
      ${Object.entries(UNITS).map(([k, v]) =>
        `<label class="chk"><input type="checkbox" class="u-chk" value="${k}" checked>${v}</label>`).join("")}
    </div>
    <div class="card">
      <h2>問題形式</h2>
      ${Object.entries(TYPES).map(([k, v]) =>
        `<label class="chk"><input type="checkbox" class="t-chk" value="${k}" checked>${v}</label>`).join("")}
    </div>
    <div class="card">
      <h2>問題数</h2>
      <select id="q-count">
        <option value="10">10問(すきま時間用)</option>
        <option value="20" selected>20問(標準)</option>
        <option value="all">全問(総仕上げ)</option>
      </select>
    </div>
    <button class="btn-main" id="btn-start">テスト開始</button>
    ${histHtml}
  `;
  $("btn-start").onclick = startQuiz;
}

function startQuiz(reviewQuestions) {
  let pool;
  if (Array.isArray(reviewQuestions)) {
    pool = reviewQuestions;
  } else {
    const units = [...document.querySelectorAll(".u-chk:checked")].map(c => c.value);
    const types = [...document.querySelectorAll(".t-chk:checked")].map(c => c.value);
    if (!units.length || !types.length) {
      alert("単元と問題形式を1つ以上選んでください。");
      return;
    }
    pool = QUESTIONS.filter(q => units.includes(q.unit) && types.includes(q.type));
    if (!pool.length) {
      alert("選んだ条件に合う問題がありません。");
      return;
    }
    const n = $("q-count").value;
    pool = shuffle(pool);
    if (n !== "all") pool = pool.slice(0, Number(n));
  }
  quiz = Array.isArray(reviewQuestions) ? shuffle(pool) : pool;
  idx = 0;
  results = [];
  $("screen-start").style.display = "none";
  $("screen-result").style.display = "none";
  $("screen-quiz").style.display = "";
  renderQuestion();
}

/* ---------- 出題画面 ---------- */
function renderQuestion() {
  const q = quiz[idx];
  const pct = Math.round(idx / quiz.length * 100);
  let body = "";

  if (q.type === "choice") {
    const order = shuffle(q.choices.map((_, i) => i));
    body = order.map(i =>
      `<button class="choice-btn" data-i="${i}">${q.choices[i]}</button>`).join("");
  } else if (q.type === "term") {
    body = `
      <input type="text" id="term-input" placeholder="答えを入力(用語)" autocomplete="off">
      <div class="nextbar" style="display:flex;gap:8px">
        <button class="btn-sub" id="term-check" style="flex:2">答え合わせ</button>
        <button class="btn-ghost" id="term-giveup" style="flex:1">わからない</button>
      </div>`;
  } else if (q.type === "order") {
    orderPick = [];
    body = `
      <p class="num">古い順にタップして並べてください。</p>
      <div class="order-picked" id="order-picked"></div>
      <div class="order-pool" id="order-pool"></div>
      <button class="btn-ghost" id="order-reset" style="margin-top:8px">やり直す</button>`;
  } else if (q.type === "essay") {
    body = `
      <textarea id="essay-input" placeholder="自分の言葉で書いてみましょう"></textarea>
      <button class="btn-sub nextbar" id="essay-show" style="width:100%">模範解答を見る</button>`;
  }

  $("screen-quiz").innerHTML = `
    <div class="card">
      <div class="num">第${idx + 1}問 / 全${quiz.length}問</div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
      <span class="tag tag-unit">${UNITS[q.unit]}</span><span class="tag tag-type">${TYPES[q.type]}</span>
      <div class="qtext">${q.q}</div>
      ${body}
      <div id="fb"></div>
    </div>
    <button class="btn-ghost" id="btn-quit" style="width:100%">中断して結果を見る</button>
  `;
  $("btn-quit").onclick = () => showResult(true);

  if (q.type === "choice") {
    document.querySelectorAll(".choice-btn").forEach(btn => {
      btn.onclick = () => judgeChoice(q, Number(btn.dataset.i), btn);
    });
  } else if (q.type === "term") {
    $("term-check").onclick = () => judgeTerm(q, $("term-input").value);
    $("term-giveup").onclick = () => judgeTerm(q, null);
    $("term-input").addEventListener("keydown", e => {
      if (e.key === "Enter") judgeTerm(q, $("term-input").value);
    });
    $("term-input").focus();
  } else if (q.type === "order") {
    renderOrderPool(q);
    $("order-reset").onclick = () => { orderPick = []; renderOrderPool(q); };
  } else if (q.type === "essay") {
    $("essay-show").onclick = () => showEssayModel(q);
  }
}

/* --- 4択 --- */
function judgeChoice(q, picked, btn) {
  const ok = picked === q.answer;
  document.querySelectorAll(".choice-btn").forEach(b => {
    b.disabled = true;
    if (Number(b.dataset.i) === q.answer) b.classList.add("correct");
  });
  if (!ok) btn.classList.add("wrong");
  finishQuestion(q, ok ? 1 : 0, ok ? null : (picked === null ? "(無回答)" : q.choices[picked]));
}

/* --- 一問一答 --- */
function normalize(s) {
  return (s || "")
    .trim()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\s　・=＝\-ー–—「」『』()（）.。、]/g, "")
    .toLowerCase();
}
function judgeTerm(q, input) {
  const user = input === null ? null : input.trim();
  const ok = user !== null && q.answers.some(a => normalize(a) === normalize(user)) && normalize(user) !== "";
  $("term-check").disabled = true;
  $("term-giveup").disabled = true;
  $("term-input").disabled = true;
  if (ok) {
    finishQuestion(q, 1, null);
  } else {
    // 表記ゆれ救済:不正解判定でも本人が合っていると判断したら正解にできる
    finishQuestion(q, 0, user === null ? "(わからない)" : user, true);
  }
}

/* --- 年代整序 --- */
function renderOrderPool(q) {
  const remaining = shuffleStable(q.events).filter(e => !orderPick.includes(e));
  $("order-picked").innerHTML = orderPick.map((e, i) =>
    `<span>${i + 1}. ${esc(e)}</span>`).join("");
  $("order-pool").innerHTML = remaining.map(e =>
    `<button class="choice-btn" data-e="${esc(e)}">${esc(e)}</button>`).join("");
  document.querySelectorAll("#order-pool .choice-btn").forEach(btn => {
    btn.onclick = () => {
      orderPick.push(btn.dataset.e);
      if (orderPick.length === q.events.length) {
        renderOrderPool(q);
        judgeOrder(q);
      } else {
        renderOrderPool(q);
      }
    };
  });
}
// 同じ問題内では並び順が変わらないように、文字列に基づく疑似シャッフル
function shuffleStable(events) {
  return events.slice().sort((a, b) => hash(a + idx) - hash(b + idx));
}
function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return h;
}
function judgeOrder(q) {
  const ok = q.events.every((e, i) => orderPick[i] === e);
  $("order-reset").style.display = "none";
  finishQuestion(q, ok ? 1 : 0, ok ? null : orderPick.map((e, i) => `${i + 1}.${e}`).join(" / "));
}

/* --- 記述 --- */
function showEssayModel(q) {
  $("essay-show").style.display = "none";
  $("essay-input").disabled = true;
  const fb = $("fb");
  fb.innerHTML = `
    <div class="model-box">
      <div class="mh">【模範解答】</div>
      ${esc(q.model)}
      <div class="mh" style="margin-top:8px">【採点ポイント】</div>
      <ul style="margin:4px 0 0;padding-left:20px">${q.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      ${q.exp ? `<div class="exp" style="margin-top:8px;border-top:1px dashed #bbb;padding-top:6px">💡 ${esc(q.exp)}</div>` : ""}
    </div>
    <p style="margin:12px 0 4px;font-weight:bold">自己採点してください:</p>
    <div class="grade-btns">
      <button class="g-ok" id="g-ok">◎ 書けた</button>
      <button class="g-half" id="g-half">△ 半分</button>
      <button class="g-ng" id="g-ng">✕ 書けず</button>
    </div>`;
  const userText = $("essay-input").value;
  $("g-ok").onclick = () => afterEssay(q, 1, userText);
  $("g-half").onclick = () => afterEssay(q, 0.5, userText);
  $("g-ng").onclick = () => afterEssay(q, 0, userText);
}
function afterEssay(q, score, userText) {
  document.querySelectorAll(".grade-btns button").forEach(b => b.disabled = true);
  results.push({ q, score, userAns: score === 1 ? null : (userText || "(未記入)") });
  const fb = $("fb");
  fb.insertAdjacentHTML("beforeend", `<button class="btn-main nextbar" id="btn-next">${idx + 1 < quiz.length ? "次の問題へ" : "結果を見る"}</button>`);
  $("btn-next").onclick = nextQuestion;
  $("btn-next").scrollIntoView({ behavior: "smooth", block: "center" });
}

/* --- 共通:判定表示と次へ --- */
function finishQuestion(q, score, userAns, allowOverride) {
  results.push({ q, score, userAns });
  const ok = score === 1;
  const fb = $("fb");
  let answerLine = "";
  if (q.type === "term") answerLine = `<div>正解:<b>${esc(q.answers[0])}</b>${q.answers.length > 1 ? `(別解:${q.answers.slice(1).map(esc).join("、")})` : ""}</div>`;
  if (q.type === "choice") answerLine = `<div>正解:<b>${esc(q.choices[q.answer])}</b></div>`;
  if (q.type === "order") answerLine = `<div>正解:${q.events.map((e, i) => `<div>${i + 1}. ${esc(e)}</div>`).join("")}</div>`;

  fb.innerHTML = `
    <div class="feedback ${ok ? "ok" : "ng"}">
      <div class="verdict">${ok ? "○ 正解!" : "✕ 不正解"}</div>
      ${answerLine}
      <div class="exp">💡 ${esc(q.exp)}</div>
    </div>
    ${!ok && allowOverride ? `<button class="btn-ghost nextbar" id="btn-override" style="width:100%">表記ゆれ等で実は合っていた → 正解にする</button>` : ""}
    <button class="btn-main nextbar" id="btn-next">${idx + 1 < quiz.length ? "次の問題へ" : "結果を見る"}</button>`;
  if (!ok && allowOverride) {
    $("btn-override").onclick = () => {
      results[results.length - 1].score = 1;
      results[results.length - 1].userAns = null;
      $("btn-override").disabled = true;
      $("btn-override").textContent = "正解として記録しました";
    };
  }
  $("btn-next").onclick = nextQuestion;
  $("btn-next").scrollIntoView({ behavior: "smooth", block: "center" });
}

function nextQuestion() {
  idx++;
  if (idx < quiz.length) renderQuestion();
  else showResult(false);
}

/* ---------- 結果画面 ---------- */
function showResult(aborted) {
  if (!results.length) { backToStart(); return; }
  $("screen-quiz").style.display = "none";
  $("screen-result").style.display = "";

  const total = results.length;
  const score = results.reduce((s, r) => s + r.score, 0);
  const pct = Math.round(score / total * 100);

  // 単元別集計
  const perUnit = {};
  for (const key of Object.keys(UNITS)) perUnit[key] = { got: 0, tot: 0 };
  results.forEach(r => { perUnit[r.q.unit].got += r.score; perUnit[r.q.unit].tot += 1; });

  const bars = Object.entries(perUnit).filter(([, v]) => v.tot > 0).map(([k, v]) => {
    const p = Math.round(v.got / v.tot * 100);
    return `<div class="bar-row">
      <div class="bar-label">${UNITS[k]}</div>
      <div class="bar-outer"><div class="bar-inner" style="width:${p}%"></div></div>
      <div class="bar-pct">${p}%</div>
    </div>`;
  }).join("");

  const wrongs = results.filter(r => r.score < 1);
  const wrongHtml = wrongs.length
    ? `<div class="card"><h2>間違えた問題の復習リスト</h2>` +
      wrongs.map(r => {
        let ans = "";
        if (r.q.type === "choice") ans = r.q.choices[r.q.answer];
        else if (r.q.type === "term") ans = r.q.answers[0];
        else if (r.q.type === "order") ans = r.q.events.join(" → ");
        else ans = r.q.model;
        return `<div class="wrong-item">
          <div class="wq">Q. ${r.q.q}</div>
          ${r.userAns ? `<div style="color:var(--ng)">あなたの答え:${esc(r.userAns)}</div>` : ""}
          <div class="wa">正解:${esc(ans)}</div>
        </div>`;
      }).join("") + `</div>`
    : "";

  // 弱点コメント
  const worst = Object.entries(perUnit).filter(([, v]) => v.tot > 0)
    .sort((a, b) => (a[1].got / a[1].tot) - (b[1].got / b[1].tot))[0];
  let advice;
  if (pct >= 90) advice = "素晴らしい。仕上げに記述問題だけをもう1周して、用語を「説明できる」状態にしておこう。";
  else if (pct >= 70) advice = `合格ライン。あと一歩は「${UNITS[worst[0]]}」の復習から。間違えた問題の解説を読み直して、もう一度挑戦しよう。`;
  else if (pct >= 50) advice = `まず「${UNITS[worst[0]]}」を教科書ガイドで読み直してから再挑戦しよう。年代よりも「因果の流れ」を先に固めるのがコツ。`;
  else advice = `焦らなくて大丈夫。まずは4択と一問一答だけに絞って基本用語を固め、それから整序・記述に進もう。特に「${UNITS[worst[0]]}」を重点的に。`;

  $("screen-result").innerHTML = `
    <div class="card">
      <h2>結果${aborted ? "(中断)" : ""}</h2>
      <div class="score-big">${score} / ${total} 点</div>
      <div style="text-align:center;font-size:1.2rem;font-weight:bold;color:${pct >= 70 ? "var(--ok)" : "var(--ng)"}">${pct}%</div>
      <div style="margin-top:14px">${bars}</div>
      <div style="margin-top:14px;background:#fbf6e9;border-radius:10px;padding:12px 14px;font-size:.95rem">🎓 先生からのアドバイス:${advice}</div>
    </div>
    ${wrongHtml}
    ${wrongs.length ? `<button class="btn-sub" id="btn-retry-wrong" style="width:100%;margin-bottom:10px">間違えた問題だけ再挑戦(${wrongs.length}問)</button>` : ""}
    <button class="btn-main" id="btn-home">トップに戻る</button>
  `;
  if (wrongs.length) {
    $("btn-retry-wrong").onclick = () => startQuiz(wrongs.map(r => r.q));
  }
  $("btn-home").onclick = backToStart;

  if (!aborted) saveHistory(score, total, pct);
  window.scrollTo({ top: 0 });
}

function backToStart() {
  $("screen-result").style.display = "none";
  $("screen-quiz").style.display = "none";
  $("screen-start").style.display = "";
  renderStart();
  window.scrollTo({ top: 0 });
}

/* ---------- 成績の保存 ---------- */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { return []; }
}
function saveHistory(score, total, pct) {
  const hist = loadHistory();
  const d = new Date();
  const date = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  hist.push({ date, score: Math.round(score * 10) / 10, total, pct });
  try { localStorage.setItem(LS_KEY, JSON.stringify(hist.slice(-30))); } catch {}
}

renderStart();
</script>
</body>
</html>
